<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Control de Densidades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Encabezado -->
        <div class="bg-blue-900 text-white p-6 rounded-lg shadow-lg flex justify-between items-center">
            <h1 class="text-2xl font-bold">Panel de Control de Voladura</h1>
            <button onclick="cargarDatos()" class="bg-blue-700 hover:bg-blue-600 px-4 py-2 rounded shadow transition-colors">
                🔄 Actualizar Datos
            </button>
        </div>

        <!-- Filtros Principales -->
        <div class="bg-white p-6 rounded-lg shadow grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
            <div>
                <label class="block text-sm font-medium text-gray-700">Nivel</label>
                <select id="filtroNivel" class="mt-1 block w-full p-2 border border-gray-300 rounded text-lg bg-gray-50">
                    <option value="TODOS">Todos los Niveles</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Proyecto</label>
                <select id="filtroProyecto" class="mt-1 block w-full p-2 border border-gray-300 rounded text-lg bg-gray-50">
                    <option value="TODOS">Todos los Proyectos</option>
                </select>
            </div>
            <button onclick="aplicarFiltros()" class="bg-green-600 text-white p-2 rounded text-lg font-bold hover:bg-green-700 transition-colors">
                Aplicar Filtros
            </button>
        </div>

        <!-- KPIs -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-lg shadow border-l-4 border-blue-500">
                <h3 class="text-gray-500 font-bold">Total Taladros Medidos</h3>
                <p id="kpiTotal" class="text-4xl font-black text-gray-800">0</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow border-l-4 border-red-500">
                <h3 class="text-gray-500 font-bold">Fuera de Rango</h3>
                <p id="kpiDesviados" class="text-4xl font-black text-red-600">0</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow border-l-4 border-green-500">
                <h3 class="text-gray-500 font-bold">Dentro de Rango</h3>
                <p id="kpiAprobados" class="text-4xl font-black text-green-600">0</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Columna Principal: Gráficos -->
            <div class="lg:col-span-2 space-y-6">

                <!-- GRÁFICO TIPO DIANA/VARIANZA XY ADAPTADO A DENSIDAD -->
                <div class="bg-white p-6 rounded-lg shadow flex flex-col">
                    <div class="flex justify-between items-start mb-4">
                        <h3 class="text-lg font-bold text-gray-700">Dispersión de Densidad vs Tolerancia</h3>
                        <select id="filtroMezclaDispersion" onchange="actualizarGraficoDispersion()" class="p-1 border border-gray-400 rounded bg-blue-50 text-sm font-bold text-blue-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="TODOS">Todas las Mezclas</option>
                        </select>
                    </div>
                    <canvas id="graficoDispersion" height="120"></canvas>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white p-6 rounded-lg shadow">
                        <h3 class="text-lg font-bold mb-4 text-gray-700">Calibración por Camión</h3>
                        <canvas id="graficoCamiones" height="200"></canvas>
                    </div>
                    
                    <!-- GRÁFICO: Curva de Gasificación x Toma -->
                    <div class="bg-white p-6 rounded-lg shadow flex flex-col">
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="text-lg font-bold text-gray-700 leading-tight">Control de Densidades<br><span class="text-sm font-normal text-gray-500">x Toma x MMU</span></h3>
                            <select id="filtroProductoGrafico" onchange="actualizarGraficoGasificacion()" class="p-1 border border-gray-400 rounded bg-blue-50 text-sm font-bold text-blue-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </select>
                        </div>
                        <canvas id="graficoGasificacion" height="200"></canvas>
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-6">
                    <div class="bg-white p-6 rounded-lg shadow">
                        <h3 class="text-lg font-bold mb-4 text-gray-700">Densidad Promedio por Tipo de Roca</h3>
                        <canvas id="graficoRoca" height="100"></canvas>
                    </div>
                </div>

            </div>

            <!-- Columna Secundaria: Tabla -->
            <div class="bg-white p-6 rounded-lg shadow overflow-hidden flex flex-col h-full min-h-[800px]">
                <h3 class="text-lg font-bold mb-4 text-gray-700">Detalle de Mediciones</h3>
                <div class="overflow-y-auto flex-1">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky top-0 bg-gray-100 shadow-sm">
                            <tr class="text-sm">
                                <th class="p-2 border-b">Taladro</th>
                                <th class="p-2 border-b">Densidad</th>
                                <th class="p-2 border-b">Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tablaDetalle" class="text-sm">
                            <!-- Se llena con JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlGoogleScript = "https://script.google.com/macros/s/AKfycbyvsDKF4T-Ge4wLAyEoyxS9El2lHlP-El62zbMUBXNc_QKJjbby3y9Lm4VnOsaXrlZ6/exec"; 

        const diccionarioRangos = {
            "HA 37": { min: 1.010, max: 1.070 },
            "HA 45": { min: 1.150, max: 1.250 },
            "HA 50": { min: 1.200, max: 1.300 },
            "ANFO":  { min: 0.780, max: 0.850 }
        };

        let datosGlobales = [];
        let filtradosActuales = []; 
        
        let graficoDispersionInstance = null; 
        let graficoCamionesInstance = null;
        let graficoGasificacionInstance = null;
        let graficoRocaInstance = null;

        const paletaMMU = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#f97316'];

        async function cargarDatos() {
            try {
                document.getElementById('tablaDetalle').innerHTML = '<tr><td colspan="3" class="text-center p-4">Cargando datos desde la mina...</td></tr>';
                const respuesta = await fetch(urlGoogleScript);
                datosGlobales = await respuesta.json();
                llenarFiltros();
                aplicarFiltros(); 
            } catch (error) {
                console.error("Error cargando datos:", error);
                alert("Error al conectar con la base de datos.");
            }
        }

        function llenarFiltros() {
            const niveles = [...new Set(datosGlobales.map(d => d['Nivel']))].filter(Boolean);
            const proyectos = [...new Set(datosGlobales.map(d => d['Proyecto']))].filter(Boolean);

            document.getElementById('filtroNivel').innerHTML = '<option value="TODOS">Todos los Niveles</option>' + 
                niveles.map(n => `<option value="${n}">${n}</option>`).join('');

            document.getElementById('filtroProyecto').innerHTML = '<option value="TODOS">Todos los Proyectos</option>' + 
                proyectos.map(p => `<option value="${p}">${p}</option>`).join('');

            const selectorProducto = document.getElementById('filtroProductoGrafico');
            selectorProducto.innerHTML = Object.keys(diccionarioRangos).map(p => `<option value="${p}">${p}</option>`).join('');

            const selectorDispersion = document.getElementById('filtroMezclaDispersion');
            selectorDispersion.innerHTML = '<option value="TODOS">Todas las Mezclas</option>' + Object.keys(diccionarioRangos).map(p => `<option value="${p}">${p}</option>`).join('');
        }

        function aplicarFiltros() {
            const nivelSel = document.getElementById('filtroNivel').value;
            const proyectoSel = document.getElementById('filtroProyecto').value;

            let filtrados = datosGlobales;
            filtradosActuales = datosGlobales;

            if (nivelSel !== "TODOS") {
                filtrados = filtrados.filter(d => d['Nivel'] != null && String(d['Nivel']).trim().toLowerCase() === String(nivelSel).trim().toLowerCase());
                filtradosActuales = filtradosActuales.filter(d => d['Nivel'] != null && String(d['Nivel']).trim().toLowerCase() === String(nivelSel).trim().toLowerCase());
            }
            if (proyectoSel !== "TODOS") {
                filtrados = filtrados.filter(d => d['Proyecto'] != null && String(d['Proyecto']).trim().toLowerCase() === String(proyectoSel).trim().toLowerCase());
                filtradosActuales = filtradosActuales.filter(d => d['Proyecto'] != null && String(d['Proyecto']).trim().toLowerCase() === String(proyectoSel).trim().toLowerCase());
            }
            procesarDashboard(filtrados);
        }

        function procesarDashboard(datos) {
            let aprobados = 0, desviados = 0;
            let filasTabla = '';

            const desempeñoCamiones = {}; 
            const acumuladorRoca = {};

            datos.forEach(d => {
                const densidad = parseFloat(d['Densidad Medida']);
                const mezcla = d['Tipo de Mezcla'] ? String(d['Tipo de Mezcla']).trim() : '';
                const camion = d['Camión'] ? String(d['Camión']).trim() : 'S/A';
                const roca = d['Tipo de Roca'] ? String(d['Tipo de Roca']).trim() : 'Desconocida';

                if(isNaN(densidad) || !diccionarioRangos[mezcla]) return;

                const rangoObjetivo = diccionarioRangos[mezcla];

                if (!desempeñoCamiones[camion]) desempeñoCamiones[camion] = { ok: 0, desviado: 0 };
                if (!acumuladorRoca[roca]) acumuladorRoca[roca] = { suma: 0, total: 0 };

                acumuladorRoca[roca].suma += densidad;
                acumuladorRoca[roca].total++;

                let estadoHtml = '';
                if (densidad >= rangoObjetivo.min && densidad <= rangoObjetivo.max) {
                    aprobados++;
                    desempeñoCamiones[camion].ok++;
                    estadoHtml = '<span class="bg-green-100 text-green-800 px-2 py-1 rounded font-bold text-xs">🟢 OK</span>';
                } else {
                    desviados++;
                    desempeñoCamiones[camion].desviado++;
                    estadoHtml = '<span class="bg-red-100 text-red-800 px-2 py-1 rounded font-bold text-xs">🔴 DESVIADO</span>';
                }

                filasTabla += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-2 font-bold">${d['Taladro']}</td>
                        <td class="p-2">${densidad.toFixed(3)}</td>
                        <td class="p-2">${estadoHtml}</td>
                    </tr>
                `;
            });

            document.getElementById('kpiTotal').innerText = aprobados + desviados;
            document.getElementById('kpiAprobados').innerText = aprobados;
            document.getElementById('kpiDesviados').innerText = desviados;
            document.getElementById('tablaDetalle').innerHTML = filasTabla || '<tr><td colspan="3" class="text-center p-4 text-red-500 font-bold">No hay datos válidos para este filtro</td></tr>';

            dibujarGraficoApilado('graficoCamiones', graficoCamionesInstance, desempeñoCamiones);
            dibujarGraficoRoca('graficoRoca', graficoRocaInstance, acumuladorRoca);

            actualizarGraficoGasificacion();
            actualizarGraficoDispersion();
        }

        // ==========================================
        // GRÁFICO DISPERSIÓN ESTILO "VARIANZA XY" 
        // ==========================================
        function actualizarGraficoDispersion() {
            const mezclaSel = document.getElementById('filtroMezclaDispersion').value;
            const ctx = document.getElementById('graficoDispersion').getContext('2d');
            
            if (graficoDispersionInstance) graficoDispersionInstance.destroy();

            let datosParaGrafico = filtradosActuales;
            if (mezclaSel !== "TODOS") {
                datosParaGrafico = filtradosActuales.filter(d => {
                    const mezcla = d['Tipo de Mezcla'] ? String(d['Tipo de Mezcla']).trim() : '';
                    return mezcla === mezclaSel;
                });
            }

            const dataPuntos = [];
            const coloresPuntos = [];
            let limiteSuperiorRojo = [], limiteInferiorRojo = [];
            let limiteSuperiorVerde = [], limiteInferiorVerde = [];
            let minEscala = null, maxEscala = null;

            if (mezclaSel !== "TODOS" && diccionarioRangos[mezclaSel]) {
                const limites = diccionarioRangos[mezclaSel];
                const centro = (limites.min + limites.max) / 2;
                const toleranciaMax = (limites.max - limites.min) / 2;
                const toleranciaMedia = toleranciaMax * 0.5; // Equivalente al círculo verde interno

                minEscala = limites.min - (toleranciaMax * 0.5);
                maxEscala = limites.max + (toleranciaMax * 0.5);

                datosParaGrafico.forEach((d, index) => {
                    limiteInferiorRojo.push({x: index + 1, y: limites.min});
                    limiteSuperiorRojo.push({x: index + 1, y: limites.max});
                    limiteInferiorVerde.push({x: index + 1, y: centro - toleranciaMedia});
                    limiteSuperiorVerde.push({x: index + 1, y: centro + toleranciaMedia});
                });
            }

            let contadorX = 1;
            datosParaGrafico.forEach(d => {
                const den = parseFloat(d['Densidad Medida']);
                const mezcla = d['Tipo de Mezcla'] ? String(d['Tipo de Mezcla']).trim() : '';
                
                if (isNaN(den) || !diccionarioRangos[mezcla]) return;

                dataPuntos.push({x: contadorX, y: den});

                const limites = diccionarioRangos[mezcla];
                const centro = (limites.min + limites.max) / 2;
                const toleranciaMax = (limites.max - limites.min) / 2;
                const toleranciaMedia = toleranciaMax * 0.5;
                const desviacion = Math.abs(den - centro);

                // Colores basados en la imagen (Varianza XY)
                if (desviacion <= toleranciaMedia) {
                    coloresPuntos.push('rgba(59, 130, 246, 0.9)'); // Azul (Centro)
                } else if (desviacion <= toleranciaMax) {
                    coloresPuntos.push('rgba(168, 85, 247, 0.9)'); // Morado (Anillo medio)
                } else {
                    coloresPuntos.push('rgba(239, 68, 68, 0.9)'); // Rojo (Fuera de rango)
                }
                contadorX++;
            });

            let datasets = [{
                label: 'Densidad',
                data: dataPuntos,
                backgroundColor: coloresPuntos,
                borderColor: 'rgba(255,255,255,0.2)',
                borderWidth: 1,
                pointRadius: 6,
                pointHoverRadius: 9,
                type: 'scatter'
            }];

            if (mezclaSel !== "TODOS") {
                // Líneas Rojas (Límites Externos)
                datasets.push({
                    label: 'Límite Crítico', data: limiteSuperiorRojo, borderColor: 'rgba(239, 68, 68, 0.7)',
                    borderWidth: 2, type: 'line', pointRadius: 0, fill: false
                });
                datasets.push({
                    label: 'Límite Crítico', data: limiteInferiorRojo, borderColor: 'rgba(239, 68, 68, 0.7)',
                    borderWidth: 2, type: 'line', pointRadius: 0, fill: false
                });
                // Líneas Verdes (Límites Internos)
                datasets.push({
                    label: 'Límite Óptimo', data: limiteSuperiorVerde, borderColor: 'rgba(34, 197, 94, 0.7)',
                    borderWidth: 2, type: 'line', pointRadius: 0, fill: false
                });
                datasets.push({
                    label: 'Límite Óptimo', data: limiteInferiorVerde, borderColor: 'rgba(34, 197, 94, 0.7)',
                    borderWidth: 2, type: 'line', pointRadius: 0, fill: false
                });
            }

            graficoDispersionInstance = new Chart(ctx, {
                data: { datasets: datasets },
                options: {
                    responsive: true,
                    scales: {
                        y: { 
                            title: { display: true, text: 'Densidad (g/cc)' },
                            min: minEscala !== null ? minEscala : undefined,
                            max: maxEscala !== null ? maxEscala : undefined
                        },
                        x: { 
                            title: { display: true, text: 'N° de Toma' },
                            ticks: { stepSize: 1 }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        // ==========================================
        // LÓGICA EXISTENTE: GRÁFICO TOMAS x MMU
        // ==========================================
        function actualizarGraficoGasificacion() {
            const productoSel = document.getElementById('filtroProductoGrafico').value;
            const ctx = document.getElementById('graficoGasificacion').getContext('2d');
            
            if (graficoGasificacionInstance) graficoGasificacionInstance.destroy();
            if (!productoSel) return;

            const datosProducto = filtradosActuales.filter(d => {
                const mezcla = d['Tipo de Mezcla'] ? String(d['Tipo de Mezcla']).trim() : '';
                return mezcla === productoSel;
            });

            const agrupadoCamiones = {};
            datosProducto.forEach(d => {
                const camion = d['Camión'] ? String(d['Camión']).trim() : 'S/A';
                const densidad = parseFloat(d['Densidad Medida']);
                
                let fechaObj = new Date(d['Fecha/Hora']);
                if(isNaN(fechaObj.getTime())) fechaObj = new Date(0); 

                if (!agrupadoCamiones[camion]) agrupadoCamiones[camion] = [];
                if (!isNaN(densidad)) {
                    agrupadoCamiones[camion].push({ densidad: densidad, tiempoObj: fechaObj });
                }
            });

            let datasets = [];
            let maxTomas = 0;
            let colorIndex = 0;

            for (let camion in agrupadoCamiones) {
                agrupadoCamiones[camion].sort((a, b) => a.tiempoObj - b.tiempoObj);
                const datosOrdenados = agrupadoCamiones[camion].map(item => item.densidad);
                
                if (datosOrdenados.length > maxTomas) maxTomas = datosOrdenados.length;

                datasets.push({
                    label: camion,
                    data: datosOrdenados,
                    borderColor: paletaMMU[colorIndex % paletaMMU.length],
                    backgroundColor: paletaMMU[colorIndex % paletaMMU.length],
                    borderDash: [5, 5], 
                    borderWidth: 2,
                    pointRadius: 4,
                    fill: false,
                    tension: 0.2
                });
                colorIndex++;
            }

            let labelsEjeX = [];
            for (let i = 1; i <= maxTomas; i++) {
                labelsEjeX.push(`Toma ${i}`);
            }

            graficoGasificacionInstance = new Chart(ctx, {
                type: 'line',
                data: { labels: labelsEjeX, datasets: datasets },
                options: {
                    responsive: true,
                    scales: { y: { title: { display: true, text: 'Densidad (g/cc)' } } },
                    plugins: {
                        legend: { position: 'right', labels: { boxWidth: 12, usePointStyle: true } },
                        tooltip: { mode: 'index', intersect: false }
                    }
                }
            });
        }

        // Funciones de gráficos restantes
        function dibujarGraficoApilado(idCanvas, instanciaVar, datosDesempeño) {
            const ctx = document.getElementById(idCanvas).getContext('2d');
            if (instanciaVar) instanciaVar.destroy();
            if (window[idCanvas + 'Instance']) window[idCanvas + 'Instance'].destroy();

            const etiquetas = Object.keys(datosDesempeño);
            const dataOk = etiquetas.map(k => datosDesempeño[k].ok);
            const dataDesviados = etiquetas.map(k => datosDesempeño[k].desviado);

            window[idCanvas + 'Instance'] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: etiquetas,
                    datasets: [
                        { label: 'Bien', data: dataOk, backgroundColor: 'rgba(34, 197, 94, 0.8)' },
                        { label: 'Desviado', data: dataDesviados, backgroundColor: 'rgba(239, 68, 68, 0.8)' }
                    ]
                },
                options: { responsive: true, scales: { x: { stacked: true }, y: { stacked: true } } }
            });
        }

        function dibujarGraficoRoca(idCanvas, instanciaVar, datosRoca) {
            const ctx = document.getElementById(idCanvas).getContext('2d');
            if (instanciaVar) instanciaVar.destroy();
            if (window[idCanvas + 'Instance']) window[idCanvas + 'Instance'].destroy();

            const etiquetas = Object.keys(datosRoca);
            const promedios = etiquetas.map(k => (datosRoca[k].suma / datosRoca[k].total).toFixed(3));

            window[idCanvas + 'Instance'] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: etiquetas,
                    datasets: [{
                        label: 'Densidad Promedio',
                        data: promedios,
                        backgroundColor: 'rgba(168, 85, 247, 0.7)',
                        borderColor: 'rgb(126, 34, 206)',
                        borderWidth: 1
                    }]
                },
                options: { responsive: true, scales: { y: { beginAtZero: false } } }
            });
        }

        window.onload = cargarDatos;
    </script>
</body>
</html>
