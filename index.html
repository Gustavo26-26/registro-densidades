<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Densidades</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-4 md:p-8 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-lg shadow-xl max-w-2xl w-full">
        <h1 class="text-3xl font-bold text-blue-900 mb-6 text-center">Registro de Densidad</h1>
        
        <form id="formularioRegistro" class="space-y-4">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700">Camión</label>
                    <input type="text" name="Camión" required class="mt-1 block w-full p-2 border border-gray-300 rounded uppercase" placeholder="Ej. CE-03">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700">Vaso</label>
                    <input type="text" name="Vaso" required class="mt-1 block w-full p-2 border border-gray-300 rounded uppercase" placeholder="Ej. V001">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700">Nivel</label>
                    <input type="number" name="Nivel" required class="mt-1 block w-full p-2 border border-gray-300 rounded" placeholder="Ej. 778">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700">Proyecto</label>
                    <input type="number" name="Proyecto" required class="mt-1 block w-full p-2 border border-gray-300 rounded" placeholder="Ej. 115">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700">Tipo de Roca</label>
                    <input type="text" name="Tipo de Roca" required class="mt-1 block w-full p-2 border border-gray-300 rounded uppercase" placeholder="Ej. HFS">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700">Tipo de Taladro</label>
                    <select name="Tipo de Taladro" required class="mt-1 block w-full p-2 border border-gray-300 rounded">
                        <option value="PRODUCCIÓN">PRODUCCIÓN</option>
                        <option value="PRECORTE">PRECORTE</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700">Taladro N°</label>
                    <input type="number" name="Taladro" required class="mt-1 block w-full p-2 border border-gray-300 rounded" placeholder="Ej. 105">
                </div>
                
                <!-- IMPORTANTE: El operador elige la mezcla, pero NO ve el rango -->
                <div>
                    <label class="block text-sm font-bold text-gray-700">Tipo de Mezcla</label>
                    <select name="Tipo de Mezcla" required class="mt-1 block w-full p-2 border border-gray-300 rounded">
                        <option value="" disabled selected>Seleccione...</option>
                        <option value="HA 37">HA 37</option>
                        <option value="HA 45">HA 45</option>
                        <option value="HA 50">HA 50</option>
                        <option value="ANFO">ANFO</option>
                    </select>
                </div>
            </div>

            <hr class="my-6">

            <div class="bg-blue-50 p-4 rounded-lg border border-blue-200">
                <label class="block text-lg font-black text-blue-900 text-center mb-2">Densidad Medida (g/cc)</label>
                <input type="number" step="0.01" name="Densidad Medida" required class="block w-full p-4 border-2 border-blue-400 rounded text-center text-2xl font-bold" placeholder="0.00">
            </div>

            <!-- Campo oculto por si tu Google Apps Script requiere que la columna exista para no desordenar el Excel -->
            <input type="hidden" name="Rango Teórico" value="Calculado en Dashboard">
            <input type="hidden" name="Fecha/Hora" id="fechaHora">

            <button type="submit" id="btnGuardar" class="w-full bg-blue-700 text-white font-bold py-3 px-4 rounded hover:bg-blue-800 transition-colors mt-4 shadow-lg text-lg">
                💾 Guardar Registro
            </button>
            <p id="mensajeExito" class="hidden text-green-600 font-bold text-center mt-2">¡Datos guardados correctamente!</p>
        </form>
    </div>

    <script>
        // PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT
        const urlGoogleScript = "https://script.google.com/macros/s/AKfycbyvsDKF4T-Ge4wLAyEoyxS9El2lHlP-El62zbMUBXNc_QKJjbby3y9Lm4VnOsaXrlZ6/exec";

        document.getElementById('formularioRegistro').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnGuardar');
            btn.innerText = "⏳ Guardando...";
            btn.disabled = true;

            // Generar fecha y hora actual automáticamente
            const ahora = new Date();
            document.getElementById('fechaHora').value = ahora.toLocaleString('es-PE');

            const formData = new FormData(this);

            fetch(urlGoogleScript, {
                method: 'POST',
                body: formData,
                mode: 'no-cors' // Necesario para Google Apps Script
            }).then(() => {
                btn.innerText = "💾 Guardar Registro";
                btn.disabled = false;
                document.getElementById('mensajeExito').classList.remove('hidden');
                this.reset();
                setTimeout(() => {
                    document.getElementById('mensajeExito').classList.add('hidden');
                }, 3000);
            }).catch(error => {
                alert("Hubo un error al guardar. Revisa tu conexión.");
                btn.innerText = "💾 Guardar Registro";
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
